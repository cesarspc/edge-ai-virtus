run_name: s5_mobilenet_v3_large_v002_d
data:
  version: v002
  source: fungitastic
  split_column: split
  image_root: data/raw/images/fungitastic_v002
  download_manifest: data/raw/images/fungitastic_v002/download_manifest.csv
  require_all_images: true
model:
  architecture: mobilenet_v3_large
  pretrained_weights: IMAGENET1K_V1
  num_classes: 10
input:
  size: 224
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  train_augment:
    random_resized_crop_scale:
    - 0.5
    - 1.0
    horizontal_flip: true
    color_jitter:
    - 0.2
    - 0.2
    - 0.2
    - 0.02
  eval_resize: 224
training:
  seed: 42
  epochs: 30
  batch_size: 64
  num_workers: 4
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 1
  label_smoothing: 0.1
  class_weighting: inverse_sqrt
  amp: true
  early_stopping_patience: 5
  selection_metric: val_obs_macro_f1
  deterministic: false
evaluation:
  batch_size: 64
  top_k:
  - 1
  - 3
  observation_aggregation: mean_prob
  evaluate_test_at_end: false
output:
  runs_dir: runs
experiment:
  phase: S5
  campaign: mobilenet_v3_large_v002
  trial: d
