  manifest: data/manifests/remote_queries.csv
  folder: data/raw/mind_funga_v2/api/
counts:
  images_reported: 17467
  images_verified: 18023
  observations_reported: NA
  observations_verified: NA
license: 'CC BY-NC 3.0 (Mendeley Data): uso no comercial con atribución. Imágenes de fuentes mixtas (grupos de Facebook,
  ciencia ciudadana, artículos, socios); la procedencia por imagen no está en los metadatos.'
known_relationships: Independiente de las demás fuentes; puede solapar con iNaturalist/GBIF (fotografías de ciencia
  ciudadana) — no verificable sin observación/URL.
next_step: Contactar al proyecto (mind.funga@gmail.com, según su sitio) para aclarar agrupación por observación,
  variantes de fondo y la discrepancia entre archivos e imágenes declaradas; descargar el ZIP (3,2 GB) manualmente
  desde el navegador solo si se decide usarlo.
notes: species_verified/genera_verified se DERIVAN del nombre de carpeta (solo binomios sin 'sp./aff./cf.'); classes
  = carpetas. Ver adapters.audit_mind_funga.
